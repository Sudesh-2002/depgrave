name: depgrave — dependency risk scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Scan dependency risk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: cd packages/cli && pnpm build

      - name: Run depgrave scan
        env:
          GITHUB_TOKEN: ${{ secrets.DEPGRAVE_GITHUB_TOKEN }}
        run: |
          node packages/cli/dist/index.js . \
            --output depgrave-report.json \
            --fail-on critical
        continue-on-error: true
        id: scan

      - name: Upload depgrave report
        uses: actions/upload-artifact@v4
        with:
          name: depgrave-report
          path: depgrave-report.json
          retention-days: 30

      - name: Comment risk summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = 'depgrave-report.json';

            if (!fs.existsSync(path)) {
              console.log('No report found, skipping comment.');
              return;
            }

            const report  = JSON.parse(fs.readFileSync(path, 'utf8'));
            const { summary, total, scannedAt } = report;

            const body = [
              '## 🪦 depgrave — dependency risk report',
              '',
              `Scanned **${total}** packages on ${new Date(scannedAt).toUTCString()}`,
              '',
              '| Risk Level | Count |',
              '|---|---|',
              `| 🔴 Critical | ${summary.critical} |`,
              `| 🟠 High     | ${summary.high} |`,
              `| 🟡 Medium   | ${summary.medium} |`,
              `| 🟢 Low      | ${summary.low} |`,
              '',
              summary.critical > 0
                ? `> ⚠️ **${summary.critical} critical package(s) found.** Review the full report artifact.`
                : '> ✅ No critical packages found.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number : context.issue.number,
              owner        : context.repo.owner,
              repo         : context.repo.repo,
              body,
            });

      - name: Fail if critical packages found
        if: steps.scan.outcome == 'failure'
        run: |
          echo "❌ depgrave found critical packages. See report artifact for details."
          exit 1